version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "23 4 7 * *"
    cooldown:
      default: 7
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "41 4 7 * *"
    cooldown:
      default: 7
    open-pull-requests-limit: 15
